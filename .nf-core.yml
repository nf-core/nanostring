lint:
  files_exist:
    - .github/workflows/linting_comment.yml
    # iGenomes is not used for NanoString data (#201)
    - conf/igenomes.config
    - conf/igenomes_ignored.config
  files_unchanged:
    - .github/PULL_REQUEST_TEMPLATE.md
    - .github/workflows/linting.yml
    - .github/workflows/branch.yml
  # Pipeline parameters are declared as typed parameters in main.nf (#201), which
  # nf-core/tools 4.2.x lint does not read (it only inspects `nextflow config` output).
  # TODO: Remove these ignores once nf-core/tools supports typed parameters.
  nextflow_config:
    - params.input
    - config_defaults:
        - params.max_multiqc_email_size
        - params.validate_params
  schema_params: false
  # validation.nf.test fails at parameter validation before any task runs, so there is no versions.yml to snapshot
  nf_test_content:
    - tests/validation.nf.test
nf_core_version: 4.2.2
repository_type: pipeline
template:
  author: Peltzer, Alexander & Mohr, Christopher
  description: A Nanostring nCounter analysis pipeline
  force: false
  is_nfcore: true
  name: nanostring
  org: nf-core
  outdir: .
  skip_features:
    - fastqc
    - igenomes
  version: 2.0.1dev
